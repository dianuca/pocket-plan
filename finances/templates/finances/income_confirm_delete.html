{% extends "base.html" %}

{% block title %}Șterge venitul | PocketPlan{% endblock %}

{% block content %}
    <h1>Șterge venitul</h1>

    <p>
        Sigur vrei să ștergi venitul „{{ income.source }}”,
        de {{ income.amount|floatformat:2 }} lei?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmă ștergerea</button>
    </form>

    <a href="{{ cancel_url }}">Anulează</a>
{% endblock %}
