<h2 id="edit-modal-title">Editează cheltuiala</h2>

<form method="post" action="{% url 'expense-edit' expense.pk %}">

    {{ form.as_p }}

    <div class="modal-actions">
        <button type="button" data-close-modal>Anulează</button>
        <button type="submit">Salvează modificările</button>
    </div>
</form>
