<h2 id="delete-modal-title">Șterge venitul</h2>

<p>
    Sigur vrei să ștergi venitul
    <strong>{{ income.source }}</strong>,
    în valoare de
    <strong>{{ income.amount|floatformat:2 }} lei</strong>?
</p>

<form method="post" action="{% url 'income-delete' income.pk %}">
    {% csrf_token %}

    <div class="modal-actions">
        <button type="button" data-close-modal>Anulează</button>
        <button type="submit" class="danger-button">
            Șterge venitul
        </button>
    </div>
</form>
