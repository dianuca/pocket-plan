<script>
(() => {
    const button = document.getElementById("open-entry-form");
    const panel = document.getElementById("entry-panel");
    function openModal() {
        panel.showModal();
        (panel.querySelector('[aria-invalid="true"]') || panel.querySelector('input:not([type="hidden"]), select'))?.focus();
    }
    button.addEventListener("click", openModal);
    panel.querySelector("[data-close-entry]").addEventListener("click", () => panel.close());
    panel.addEventListener("close", () => button.focus());
    if (panel.dataset.hasErrors === "true") openModal();
})();
</script>
