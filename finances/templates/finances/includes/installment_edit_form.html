<h2 id="edit-modal-title">Editează rata</h2>

<form
    method="post"
    action="{% url 'installment-edit' installment.pk %}"
>
    {% csrf_token %}
    {{ form.as_p }}

    <div class="modal-actions">
        <button type="button" data-close-modal>Anulează</button>
        <button type="submit">Salvează modificările</button>
    </div>
</form>
